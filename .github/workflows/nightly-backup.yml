# Nightly backup of the family directory, with a practice restore.
#
# 1. Saves the database (roles, structure, all data including sign-in
#    accounts) and every profile photo.
# 2. Practice restore: loads the data into a throwaway local Supabase and
#    checks the counts match the live database. A mismatch fails the run,
#    and GitHub emails the repository owner.
# 3. Encrypts everything with BACKUP_PASSPHRASE and keeps it for 30 days as a
#    private download on this run's page.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL         the "Session pooler" connection string, with the database password
#   SUPABASE_ACCESS_TOKEN   a Supabase personal access token (for the photos)
#   BACKUP_PASSPHRASE       a long passphrase, also kept in your password manager
#
# See docs/backup-and-restore.md.

name: Nightly backup

on:
  schedule:
    - cron: "17 9 * * *" # about 2 a.m. Pacific
  workflow_dispatch: # "Run workflow" button for an on-demand backup

permissions:
  contents: read

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      PROJECT_REF: rnumsgxknettjvjyyxdj
    steps:
      - name: Check the secrets are set
        run: |
          for name in SUPABASE_DB_URL SUPABASE_ACCESS_TOKEN BACKUP_PASSPHRASE; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; exit 1; fi
          done

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Install the Postgres client
        run: sudo apt-get update -q && sudo apt-get install -yq postgresql-client

      - name: Save the database
        run: |
          mkdir -p backup/photos
          psql "$SUPABASE_DB_URL" -At -f scripts/backup/counts.sql > backup/live-counts.txt
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only

      - name: Save the photos
        id: photos
        run: supabase storage cp -r ss:///profile-photos backup/photos --project-ref "$PROJECT_REF" --experimental

      - name: Practice restore into a throwaway database
        run: |
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor,realtime
          scripts/backup/verify-restore.sh backup
          supabase stop --no-backup

      # The backup is kept even if the practice restore failed: a saved copy
      # is better than none, and the red ✕ still flags the problem.
      - name: Encrypt
        if: ${{ !cancelled() && steps.photos.outcome == 'success' }}
        run: |
          rm -f backup/data-for-practice.sql
          stamp=$(date -u +%Y-%m-%d)
          tar -czf - backup | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 3<<<"$BACKUP_PASSPHRASE" -o "family-directory-backup-$stamp.tar.gz.gpg"
          rm -rf backup
          echo "STAMP=$stamp" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.photos.outcome == 'success' }}
        with:
          name: family-directory-backup-${{ env.STAMP }}
          path: family-directory-backup-*.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
